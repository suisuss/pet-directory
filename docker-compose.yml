services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pets_db
      POSTGRES_USER: pets_user
      POSTGRES_PASSWORD: pets_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pets_user -d pets_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pets_network

  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pets_user:pets_password@db:5432/pets_db
      APP_NAME: "Pet Directory API"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks:
      - pets_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://pets_user:pets_password@db:5432/pets_db
      REPORT_INTERVAL_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m app.worker.report_generator
    networks:
      - pets_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pets_network:
    driver: bridge
