version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pets_db
      POSTGRES_USER: pets_user
      POSTGRES_PASSWORD: pets_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pets_user -d pets_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pets_network_dev

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pets_user:pets_password@db:5432/pets_db
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    networks:
      - pets_network_dev

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://pets_user:pets_password@db:5432/pets_db
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m app.worker.report_generator
    volumes:
      - ./app:/app/app
    networks:
      - pets_network_dev

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette
    depends_on:
      - db
    networks:
      - pets_network_dev

volumes:
  postgres_data_dev:

networks:
  pets_network_dev:
    driver: bridge