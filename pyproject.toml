[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-directory"
version = "1.0.0"
description = "A RESTful API service for managing a pet directory with background reporting"
readme = "README.md"
authors = [
    {name = "Jacob Sussmilch", email = "suisuss@protonmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "pydantic==2.6.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy[asyncio]==2.0.27",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "jinja2==3.1.3",
    "python-multipart==0.0.7",
    "httpx==0.26.0",
    "psycopg2-binary==2.9.9",
]

[project.optional-dependencies]
dev = [
    "mypy==1.8.0",
    "black==24.1.1",
    "ruff==0.2.1",
    "pytest==8.0.0",
    "pytest-asyncio==0.21.0",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
    "aiosqlite==0.20.0",
    "types-python-dateutil==2.8.19.14",
    "sqlalchemy[mypy]==2.0.27",
    "types-jinja2==2.11.9",
]

[project.urls]
"Homepage" = "https://github.com/suisuss/pet-directory"
"Bug Tracker" = "https://github.com/suisuss/pet-directory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short --strict-markers --disable-warnings -v --cov=app --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "timeout: mark test with a timeout"
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*", "__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "A",     # flake8-builtins
    "Q",     # flake8-quotes
    "RUF",   # ruff specific rules
    "PL",    # pylint
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "S101",   # use of assert
    "PLR0913", # too many arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "jinja2"]